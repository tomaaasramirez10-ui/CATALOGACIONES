 const[k,dir]=S.sort;rows.sort((a,b)=>(typeof a[k]==="string"?a[k].localeCompare(b[k]):a[k]-b[k])*dir);
 const th=(k,t,n)=>`<th class="${n?"n":""}" data-s="${k}">${t}${S.sort[0]===k?(S.sort[1]>0?" ▲":" ▼"):""}</th>`;
 if(S.view==="lista")h+=`<div class="wrap"><table><thead><tr>${th("sku","SKU",1)}${th("nombre","Producto")}${th("formato","Formato")}${th("categoria","Categoría")}${th("con","Salas con producto",1)}${th("pct","% de salas",1)}<th>Cobertura</th>${th("tcon","Tiendas",1)}<th>Estado</th></tr></thead><tbody>${rows.map(r=>`<tr data-sku="${r.sku}"><td class="n">${r.sku}</td><td><b>${esc(r.nombre)}</b></td><td>${esc(r.formato)}</td><td>${esc(r.categoria)}</td><td class="n">${nf(r.con)} / ${nf(salas)}</td><td class="n"><b>${pc(r.pct)}</b></td><td><div class="bar"><i style="width:${r.pct*100}%"></i></div></td><td class="n">${r.tcon}/${idx.length}</td><td><span class="b ${cls(r.con)}">${lbl(r.con)}</span></td></tr>`).join("")}</tbody></table></div>`;
 else h+=`<div class="wrap"><table><thead><tr><th>Producto</th>${idx.map(i=>`<th class="n">${esc(d.tiendas[i].tienda)}<br><small class="mut">${d.tiendas[i].salas} salas</small></th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr data-sku="${r.sku}"><td><b>${esc(r.nombre)}</b> <span class="mut">${esc(r.formato)}</span></td>${idx.map(i=>{const p=d.tiendas[i].salas?r.v[i]/d.tiendas[i].salas:0;return`<td class="n"><span class="cell ${cls(r.v[i])}" title="${r.v[i]} de ${d.tiendas[i].salas} salas">${pc(p)}<br><small style="opacity:.85">${r.v[i]} salas</small></span></td>`}).join("")}</tr>`).join("")}</tbody></table></div>`;
 return h}


/* ---------------- DRAWER ---------------- */
function openInn(sku){const c=innCalc(),r=c.all.find(x=>x.sku==sku),d=c.d;
 const evo=MONTHS.filter(k=>INNOVACIONES[k]).map(k=>{const D=INNOVACIONES[k],s=D.skus.find(x=>x.sku==sku),T=D.tiendas.reduce((a,t)=>a+t.salas,0);return{k,p:s&&T?s.v.reduce((a,b)=>a+b,0)/T:null}}).filter(e=>e.p!==null);
 $("#drawer").innerHTML=`<button class="sm x" id="cl">Cerrar ✕</button><h2>${esc(r.nombre)} ${esc(r.formato)}</h2><div class="mut">SKU ${r.sku} · ${mlong(S.mes)}</div>
 <dl><dt>Categoría</dt><dd>${esc(r.categoria)}</dd><dt>Salas con producto</dt><dd>${nf(r.con)} de ${nf(c.salas)}</dd><dt>% de salas</dt><dd><b>${pc(r.pct)}</b></dd><dt>Estado</dt><dd><span class="b ${cls(r.con)}">${lbl(r.con)}</span></dd></dl>
 <b>Evolución % de salas (total)</b><div class="evo">${evo.map(e=>`<div style="height:${Math.max(e.p*100,2)}%"><em>${pc(e.p)}</em><span>${ml(e.k)}</span></div>`).join("")}</div>
 <b>Detalle por tienda</b>${c.idx.map(i=>{const t=d.tiendas[i],v=r.v[i],p=t.salas?v/t.salas:0;return`<div class="row"><span>${esc(t.tienda)} <small class="mut">${esc(t.canal||"")}</small></span><span class="n"><b>${v}</b>/${t.salas}</span><span style="display:flex;gap:6px;align-items:center"><div class="bar" style="flex:1"><i style="width:${p*100}%"></i></div>${pc(p)} <span class="b ${cls(v)}">${v>=10?"≥10":v>=1?"<10":"0"}</span></span></div>`}).join("")}`;
 $("#drawer").classList.add("open")}

/* ---------------- CATALOGACIONES ---------------- */
const FACETS=["Tipo de consumo","Marca","Sabor","Formato","Vigencia","STATUS Final"],SHOWCOLS=["SKU ANDINA","Prod","Tipo de consumo","Sabor","Marca","Formato","Vigencia"];
function renderCat(){let h=chips(CATALOGACIONES,S.cmes,"data-cm",MONTHS_CAT),M=CATALOGACIONES[S.cmes];
 if(!M)return h+`<div class="card empty-msg">Aún no hay catalogaciones para <b>${mlong(S.cmes)}</b>.<br>Agrégalas en <code>CATALOGACIONES["${S.cmes}"]</code> (copia el bloque de otro mes).</div>`;
 const hojas=Object.keys(M);if(!M[S.hoja])S.hoja=hojas[0];const H=M[S.hoja];
 const ti=H.tiendas.map((t,i)=>i).filter(i=>(!S.tienda||H.tiendas[i]+"|"+H.cadenas[i]===S.tienda)&&(!S.cadena||H.cadenas[i]===S.cadena));
 const facs=FACETS.filter(f=>H.columnas.includes(f));
 const items=H.items.filter(it=>(!S.fq||Object.values(it).join(" ").toLowerCase().includes(S.fq.toLowerCase()))&&facs.every(f=>!S.facet[f]||it[f]===S.facet[f]));
 const totS=ti.reduce((a,i)=>a+H.total[i],0),pres=items.filter(it=>ti.some(i=>it._v[i]>0)).length,cov=items.length&&totS?items.reduce((a,it)=>a+ti.reduce((x,i)=>x+it._v[i],0),0)/(totS*items.length):0;
 const tcell=(it,i)=>{const v=it._v[i],p=H.total[i]?v/H.total[i]:0;return`<td class="n"><span class="cell ${v===0?"r":p>=.5?"g":"y"}" title="${v} de ${H.total[i]} salas">${S.modo==="n"?nf(v):pc(p)}</span></td>`};
 h+=`<div class="months">${hojas.map(k=>`<button class="chip ${k===S.hoja?"on":""}" data-h="${k}">${esc(k)} <small>(${M[k].items.length})</small></button>`).join("")}</div>
 <div class="kpis"><div class="card kpi"><small>SKUs listados</small><b>${items.length}</b><small>de ${H.items.length} · período “${esc(H.periodo)}”</small></div><div class="card kpi"><small>Total de salas ${S.tienda||S.cadena?"(filtro)":""}</small><b>${nf(totS)}</b><small>${ti.length} tiendas</small></div><div class="card kpi"><small>SKUs con presencia</small><b>${pres}</b><small>${items.length-pres} sin salas</small></div><div class="card kpi"><small>Cobertura promedio</small><b>${pc(cov)}</b><small>% de salas por SKU</small></div></div>
 <div class="tools"><input type="search" id="fq" placeholder="Buscar SKU, producto, EAN…" value="${esc(S.fq)}"><select id="fcad">${opts([...new Set(H.cadenas)],S.cadena,"Todas las cadenas")}</select><select id="ftien"><option value="">Todos los supermercados</option>${H.tiendas.map((t,i)=>{const v=t+"|"+H.cadenas[i];return`<option value="${esc(v)}" ${v===S.tienda?"selected":""}>${esc(t)} (${esc(H.cadenas[i])})</option>`}).join("")}</select>
 ${facs.map(f=>`<select data-f="${f}">${opts([...new Set(H.items.map(it=>it[f]).filter(x=>x!=null&&x!==""))],S.facet[f],f)}</select>`).join("")}
 <button class="sm ${S.modo==="n"?"on":""}" data-mo="n">N° salas</button><button class="sm ${S.modo==="p"?"on":""}" data-mo="p">% salas</button></div>
 <div class="wrap"><table><thead><tr>${SHOWCOLS.filter(c=>H.columnas.includes(c)).map(c=>`<th>${c}</th>`).join("")}${ti.map(i=>`<th class="n">${esc(H.tiendas[i])}<br><small class="mut">${esc(H.cadenas[i])} · ${H.total[i]}</small></th>`).join("")}</tr></thead>
 <tbody>${items.map((it,n)=>`<tr data-i="${H.items.indexOf(it)}">${SHOWCOLS.filter(c=>H.columnas.includes(c)).map(c=>`<td>${c==="Prod"?"<b>"+esc(it[c])+"</b>":esc(it[c])}${c==="Prod"&&["Y","SI"].includes(it.Innovaciones)?' <span class="b y">Innov.</span>':""}</td>`).join("")}${ti.map(i=>tcell(it,i)).join("")}</tr>`).join("")}</tbody></table></div>`;
 return h}
function openCat(i){const H=CATALOGACIONES[S.cmes][S.hoja],it=H.items[i];
 $("#drawer").innerHTML=`<button class="sm x" id="cl">Cerrar ✕</button><h2>${esc(it.Prod)}</h2><div class="mut">${esc(S.hoja)} · ${mlong(S.cmes)} · período “${esc(H.periodo)}”</div><dl>${H.columnas.filter(c=>c!=="Prod"&&it[c]!=null&&it[c]!=="").map(c=>`<dt>${esc(c)}</dt><dd>${esc(it[c])}</dd>`).join("")}</dl><b>Presencia por supermercado</b>${H.tiendas.map((t,j)=>{const v=it._v[j],p=H.total[j]?v/H.total[j]:0;return`<div class="row"><span>${esc(t)} <small class="mut">${esc(H.cadenas[j])}</small></span><span class="n"><b>${v}</b>/${H.total[j]}</span><span style="display:flex;gap:6px;align-items:center"><div class="bar" style="flex:1"><i style="width:${Math.min(p,1)*100}%"></i></div>${pc(p)}</span></div>`}).join("")}`;
 $("#drawer").classList.add("open")}

/* ---------------- LIMPIAR FILTROS ---------------- */
function clearF(k){if(k==='all'){S.q=S.fq=S.cat=S.canal=S.cadena=S.tienda='';S.facet={};return}
 if(k==='q')S.q='';else if(k==='fq')S.fq='';else if(k==='fcat')S.cat='';else if(k==='fcanal')S.canal='';else if(k==='fcad')S.cadena='';else if(k==='ftien')S.tienda='';else if(k.startsWith('f:'))S.facet[k.slice(2)]=''}
function addClear(){let any=false;document.querySelectorAll('.tools select,.tools input[type=search]').forEach(el=>{if(!el.value)return;any=true;const w=document.createElement('span');w.className='fw';el.parentNode.insertBefore(w,el);w.appendChild(el);const b=document.createElement('button');b.className='clr';b.type='button';b.textContent='✕';b.title='Limpiar este filtro';b.dataset.clr=el.id||'f:'+el.dataset.f;w.appendChild(b)});
 const tl=document.querySelector('.tools');if(any&&tl){const b=document.createElement('button');b.className='sm clr-all';b.textContent='Limpiar todos los filtros';b.dataset.clr='all';tl.appendChild(b)}}
/* ---------------- EVENTOS ---------------- */
function render(){const y=window.scrollY;$("#app").innerHTML=S.tab==="inn"?renderInn():renderCat();addClear();document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.t===S.tab));const q=$("#q")||$("#fq");if(q&&document.activeElement===document.body&&S.typing){q.focus();q.setSelectionRange(99,99)}window.scrollTo(0,y)}
document.addEventListener("click",e=>{const t=e.target.closest("[data-t],[data-m],[data-cm],[data-cat],[data-v],[data-s],[data-sku],[data-h],[data-i],[data-mo],#solo,#cl,[data-clr]");if(!t)return;const D=t.dataset;S.typing=false;
 if(t.id==="cl"){$("#drawer").classList.remove("open");return}
 if(D.clr){clearF(D.clr);$("#drawer").classList.remove("open");render();return}
 if(D.t)S.tab=D.t;else if(D.m)S.mes=D.m;else if(D.cm)S.cmes=D.cm;else if(D.cat)S.cat=S.cat===D.cat?"":D.cat;else if(D.v)S.view=D.v;else if(D.s)S.sort=[D.s,S.sort[0]===D.s?-S.sort[1]:(["nombre","formato","categoria"].includes(D.s)?1:-1)];
 else if(D.h)S.hoja=D.h;else if(D.mo)S.modo=D.mo;else if(t.id==="solo")S.solo=!S.solo;
 else if(D.sku){openInn(D.sku);return}else if(D.i){openCat(+D.i);return}
 $("#drawer").classList.remove("open");render()});
document.addEventListener("input",e=>{const t=e.target;S.typing=true;if(t.id==="q")S.q=t.value;else if(t.id==="fq")S.fq=t.value;else return;render()});
document.addEventListener("change",e=>{const t=e.target;S.typing=false;if(t.id==="fcat")S.cat=t.value;else if(t.id==="fcanal")S.canal=t.value;else if(t.id==="fcad")S.cadena=t.value;else if(t.id==="ftien")S.tienda=t.value;else if(t.dataset.f)S.facet[t.dataset.f]=t.value;else return;render()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#drawer").classList.remove("open")});
render();
</script></body></html>
